name: Refresh catalog

# Al-Dosari's mushaf is still being recorded — the Saudi Center airs episodes
# nightly — so new surahs appear over time. This picks them up and commits the
# updated catalog, which is what makes the app fill itself in without anyone
# touching it.
#
# Weekly, so the app can lag a few days behind the broadcast. Change to
# '0 4 * * *' for daily if that matters.
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh catalog from the audio proxy
        run: node scripts/refresh-catalog.mjs

      # A refresh that produced a broken catalog must not be committed.
      - name: Test
        run: npx vitest run

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new surahs."
            exit 0
          fi

          COUNT=$(node -e "const c=require('./data/catalog.json');console.log(c.reciters.find(r=>r.id==='dosari').surahs.length)")

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore: refresh catalog — Al-Dosari now ${COUNT}/114

          Picked up by the scheduled refresh. The Saudi Center airs episodes
          nightly, so this tracks the broadcast rather than a fixed list."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # deploy has to be asked for explicitly.
      - name: Deploy the updated catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
