<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Light only. The design has no dark variant; without this the browser
         auto-darkens the page on phones set to dark mode. -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#f6f0e6" />
    <!--
      Everything this page may talk to, enforced by the browser rather than
      promised in a policy document. Audio is the only outside origin, and it
      is our own proxy. There is no analytics, ad, or font vendor to allow —
      which is why this policy can be written at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               media-src 'self' blob: https://mushaf-audio.mushaftarteel.workers.dev;
               connect-src 'self' https://mushaf-audio.mushaftarteel.workers.dev;
               worker-src 'self';
               manifest-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <title>الموعظة — Al-Mau'iza</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
